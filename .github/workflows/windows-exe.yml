# Windows 실행파일(aesa-monitor.exe) 자동 빌드·배포
#
# - main에 반영되거나 수동 실행하면: 시험 → exe 빌드 → zip을 Actions 결과물(artifact)로 올린다.
# - v로 시작하는 태그를 올리면(예: v1.0.0): 같은 zip을 GitHub Releases에 붙인다.
#     git tag v1.0.0 && git push origin v1.0.0
# zip 안: aesa-monitor.exe, .env(처리부 기본 설정, windows/processor.env.example), setup_network.bat/.ps1, README.txt
# (monitor.env는 exe를 처음 실행할 때 exe 옆에 만들어진다)
name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 단위 시험은 지금까지 확인해 온 Linux에서 돌린다(일부 시험이 POSIX 경로를 전제로 한다).
  # Windows 전용 부분(windows/aesa_monitor_win.py의 랜카드 선택)은 tests/test_windows_entry.py가 OS와 관계없이 시험한다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        shell: cmd
        env:
          PY: python
        run: windows\build.bat

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"  # 빠진 파일이 있으면 여기서 멈춘다
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          else { $version = "${{ github.sha }}".Substring(0, 7) }
          $name = "aesa-monitor-windows-$version"
          $folder = "package/$name"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item windows/dist/aesa-monitor.exe $folder/
          # 처리부 기본 설정은 이 저장소의 사본을 넣는다(다른 저장소 구성에 기대지 않게).
          Copy-Item windows/processor.env.example $folder/.env
          Copy-Item windows/setup_network.bat, windows/setup_network.ps1, windows/README.txt $folder/
          Compress-Archive -Path $folder -DestinationPath "package/$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: package/${{ steps.package.outputs.name }}.zip

      - name: Release (tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "package/${{ steps.package.outputs.name }}.zip"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "${{ github.ref_name }}" $zip --clobber }
          else { gh release create "${{ github.ref_name }}" $zip --title "aesa-monitor ${{ github.ref_name }}" --generate-notes }
